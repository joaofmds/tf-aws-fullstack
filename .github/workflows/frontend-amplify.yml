name: frontend-amplify

on:
  push:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-amplify.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-amplify.yml'

jobs:
  trigger-amplify-dev:
    name: Trigger Amplify (dev)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')

    steps:
      - name: Trigger Amplify build via webhook (dev)
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_DEV }}
        run: |
          set -euo pipefail
          if [ -z "${AMPLIFY_WEBHOOK_URL:-}" ]; then
            echo "::error::Secret AMPLIFY_WEBHOOK_DEV is not set. Add the Amplify webhook URL (output 'webhook_url' do Terraform) as repository secret AMPLIFY_WEBHOOK_DEV."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$AMPLIFY_WEBHOOK_URL"

  trigger-amplify-prod:
    name: Trigger Amplify (prod)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - name: Trigger Amplify build via webhook (prod)
        env:
          AMPLIFY_WEBHOOK_URL: ${{ secrets.AMPLIFY_WEBHOOK_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${AMPLIFY_WEBHOOK_URL:-}" ]; then
            echo "::error::Secret AMPLIFY_WEBHOOK_PROD is not set. Add the Amplify webhook URL (output 'webhook_url' do Terraform) as repository secret AMPLIFY_WEBHOOK_PROD."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$AMPLIFY_WEBHOOK_URL"
