name: backend-deploy

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-latest

    # Roda quando:
    # - push na branch dev
    # - pull_request com base (destino) dev
    if: >
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'pull_request' && github.base_ref == 'dev')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_BACKEND: ${{ secrets.ECR_BACKEND_REPO_DEV }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_BACKEND:${GITHUB_SHA}" backend
          docker push "$ECR_BACKEND:${GITHUB_SHA}"

      - name: Build and push cron
        env:
          ECR_CRON: ${{ secrets.ECR_CRON_REPO_DEV }}
        run: |
          set -euo pipefail
          docker build -f backend/cron.Dockerfile -t "$ECR_CRON:${GITHUB_SHA}" backend
          docker push "$ECR_CRON:${GITHUB_SHA}"

      - name: Run DB migrations (one-off ECS task)
        env:
          ENV: dev
          CLUSTER: ${{ secrets.ECS_CLUSTER_DEV }}
          TASKDEF: ${{ secrets.ECS_BACKEND_TASKDEF_DEV }}
        run: |
          set -euo pipefail

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=tf-aws-fullstack" "Name=tag:Environment,Values=$ENV" \
            --query "Vpcs[0].VpcId" --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "VPC não encontrada para env=$ENV (tags Project/Environment). Ajuste os filtros para bater com o Terraform."
            exit 1
          fi

          SUBNETS_JSON=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Tier,Values=private" \
            --query "Subnets[].SubnetId" --output json)

          if [ "$SUBNETS_JSON" = "[]" ] || [ -z "$SUBNETS_JSON" ]; then
            echo "Nenhuma subnet privada encontrada (tag Tier=private) na VPC $VPC_ID. Ajuste tags/filtros."
            exit 1
          fi

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=tf-aws-fullstack-$ENV-ecs" \
            --query "SecurityGroups[0].GroupId" --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            echo "Security Group do ECS não encontrado (tag Name=tf-aws-fullstack-$ENV-ecs) na VPC $VPC_ID. Ajuste tags/filtros."
            exit 1
          fi

          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=$SUBNETS_JSON,securityGroups=[\"$SG_ID\"],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}'

      - name: Deploy ECS backend
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_DEV }}
          SERVICE: ${{ secrets.ECS_SERVICE_DEV }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-latest

    # Roda quando:
    # - push na branch prod
    # - pull_request com base (destino) prod
    if: >
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR_BACKEND: ${{ secrets.ECR_BACKEND_REPO_PROD }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_BACKEND:${GITHUB_SHA}" backend
          docker push "$ECR_BACKEND:${GITHUB_SHA}"

      - name: Build and push cron
        env:
          ECR_CRON: ${{ secrets.ECR_CRON_REPO_PROD }}
        run: |
          set -euo pipefail
          docker build -f backend/cron.Dockerfile -t "$ECR_CRON:${GITHUB_SHA}" backend
          docker push "$ECR_CRON:${GITHUB_SHA}"

      - name: Run DB migrations (one-off ECS task)
        env:
          ENV: prod
          CLUSTER: ${{ secrets.ECS_CLUSTER_PROD }}
          TASKDEF: ${{ secrets.ECS_BACKEND_TASKDEF_PROD }}
        run: |
          set -euo pipefail

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Project,Values=tf-aws-fullstack" "Name=tag:Environment,Values=$ENV" \
            --query "Vpcs[0].VpcId" --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "VPC não encontrada para env=$ENV (tags Project/Environment). Ajuste os filtros para bater com o Terraform."
            exit 1
          fi

          SUBNETS_JSON=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Tier,Values=private" \
            --query "Subnets[].SubnetId" --output json)

          if [ "$SUBNETS_JSON" = "[]" ] || [ -z "$SUBNETS_JSON" ]; then
            echo "Nenhuma subnet privada encontrada (tag Tier=private) na VPC $VPC_ID. Ajuste tags/filtros."
            exit 1
          fi

          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=tf-aws-fullstack-$ENV-ecs" \
            --query "SecurityGroups[0].GroupId" --output text)

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            echo "Security Group do ECS não encontrado (tag Name=tf-aws-fullstack-$ENV-ecs) na VPC $VPC_ID. Ajuste tags/filtros."
            exit 1
          fi

          aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASKDEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=$SUBNETS_JSON,securityGroups=[\"$SG_ID\"],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}'

      - name: Deploy ECS backend
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER_PROD }}
          SERVICE: ${{ secrets.ECS_SERVICE_PROD }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
